<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>دعوة زفاف محمود وهبة | Mahmoud & Heba</title>
    <link href="https://fonts.googleapis.com/css2?family=Amiri:ital,wght@0,400;0,700;1,400&family=Playfair+Display:ital,wght@0,500;0,700;1,400&family=Tajawal:wght@400;500;700&display=swap" rel="stylesheet">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            background-color: #faf7f2;
            font-family: 'Tajawal', sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
            color: #4a3f35;
        }
        .card {
            background: #ffffff;
            max-width: 420px;
            width: 100%;
            border-radius: 24px;
            padding: 40px 28px;
            text-align: center;
            box-shadow: 0 12px 35px rgba(138, 118, 95, 0.08);
            border: 1px solid #efe7dc;
        }
        .names {
            font-family: 'Playfair Display', serif;
            font-size: 36px;
            color: #5c4b3b;
            line-height: 1.3;
            margin-bottom: 18px;
        }
        .amp {
            font-size: 24px;
            color: #b59a7a;
            display: block;
            margin: 4px 0;
            font-style: italic;
        }
        .quote {
            font-family: 'Playfair Display', serif;
            font-style: italic;
            font-size: 14px;
            color: #8c7b6b;
            line-height: 1.6;
            margin-bottom: 28px;
            padding: 0 10px;
        }
        .details-box {
            background-color: #fcfaf7;
            border: 1px solid #f0e8dd;
            border-radius: 16px;
            padding: 20px;
            margin-bottom: 28px;
        }
        .detail-item {
            display: flex;
            align-items: center;
            text-align: right;
            gap: 14px;
        }
        .detail-item:first-child {
            padding-bottom: 16px;
            margin-bottom: 16px;
            border-bottom: 1px solid #efe7dc;
        }
        .icon-circle {
            width: 42px;
            height: 42px;
            background-color: #f3ece2;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 18px;
            flex-shrink: 0;
        }
        .detail-label {
            font-size: 11px;
            letter-spacing: 1px;
            color: #a39281;
            font-weight: 700;
            margin-bottom: 4px;
        }
        .detail-value {
            font-size: 15px;
            font-weight: 700;
            color: #4a3f35;
        }
        .btn-whatsapp {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            width: 100%;
            background-color: #25D366;
            color: #ffffff;
            text-decoration: none;
            padding: 15px 20px;
            border-radius: 14px;
            font-weight: 700;
            font-size: 15px;
            margin-bottom: 12px;
            box-shadow: 0 4px 14px rgba(37, 211, 102, 0.25);
            transition: transform 0.2s;
        }
        .btn-whatsapp:active { transform: scale(0.98); }
        .btn-copy {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            width: 100%;
            background-color: #f3ece2;
            color: #5c4b3b;
            border: none;
            padding: 14px 20px;
            border-radius: 14px;
            font-family: 'Tajawal', sans-serif;
            font-weight: 700;
            font-size: 14px;
            cursor: pointer;
        }
        .footer-note {
            margin-top: 24px;
            font-size: 13px;
            color: #9e8e7e;
        }
    </style>
</head>
<body>

<div class="card">
    <div class="names">
        Mahmoud
        <span class="amp">&amp;</span>
        Heba
    </div>
    
    <p class="quote">
        "Together with our families, we joyfully invite you to share in our celebration as we begin our new life together."
    </p>

    <div class="details-box">
        <div class="detail-item">
            <div class="icon-circle">📅</div>
            <div>
                <div class="detail-label">DATE | التاريخ</div>
                <div class="detail-value">الخميس، 26 نوفمبر 2026</div>
            </div>
        </div>
        <div class="detail-item">
            <div class="icon-circle">📍</div>
            <div>
                <div class="detail-label">VENUE | المكان</div>
                <div class="detail-value">قاعة بيانولا (Pianolla Hall)</div>
            </div>
        </div>
    </div>

    <a id="waBtn" href="#" class="btn-whatsapp" target="_blank">
        <span>مشاركة عبر واتساب (Share via WhatsApp)</span>
    </a>

    <button class="btn-copy" onclick="copyLink()">
        <span id="copyText">نسخ رابط الدعوة (Copy Link)</span>
    </button>

    <div class="footer-note">We look forward to celebrating with you 🤍</div>
</div>

<script>
    const pageUrl = window.location.href;
    const shareMessage = `✨ *دعوة زفاف Mahmoud & Heba* ✨\n\nيسعدنا حضوركم ومشاركتنا فرحتنا يوم الخميس 26 نوفمبر 2026 في قاعة بيانولا.\n\nلمشاهدة كارت الدعوة والتفاصيل:\n${pageUrl}`;
    
    document.getElementById('waBtn').href = `https://api.whatsapp.com/send?text=${encodeURIComponent(shareMessage)}`;

    function copyLink() {
        navigator.clipboard.writeText(pageUrl).then(() => {
            const btnText = document.getElementById('copyText');
            btnText.innerText = 'تم نسخ الرابط بنجاح! ✓';
            setTimeout(() => { btnText.innerText = 'نسخ رابط الدعوة (Copy Link)'; }, 2500);
        });
    }
</script>

</body>
</html>
